name: penny RSI
# CP123 D3: the deterministic RSI loop is ENABLED + ACTUALLY RUNS here (not a narrated no-op guard).
# `workflow_dispatch` (manual) + a nightly `schedule` (dsip.json cadence: nightly). The job builds the
# repo then invokes the real engine `node workflows/rsi.workflow.js --deterministic` — the 6 dsip steps
# (refresh-brain → re-verify-tool-matrix → run-eval-pyramid → propose → validate → ship), $0/tokenless.
# The Claude half (CLAUDE_CODE_OAUTH_TOKEN) stays dark until the chairman sets it (D8) — the deterministic
# half is the graded ✅ ("enabled, not just written" — the CP122 lesson).
on:
  workflow_dispatch:
  schedule:
    # Nightly, 08:00 UTC — re-verify the Stripe version baseline + tool matrix against the live ecosystem.
    - cron: "0 8 * * *"

permissions:
  contents: read

jobs:
  rsi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Friendly skip ONLY if the engine isn't built yet. Once it exists (it does — D2), the engine runs.
      - name: Detect RSI engine
        id: engine
        run: |
          if [ -f workflows/rsi.workflow.js ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "RSI engine not built yet — skipping."
          fi

      - uses: pnpm/action-setup@v4
        if: steps.engine.outputs.present == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.engine.outputs.present == 'true'
        with:
          node-version: 20
          cache: pnpm

      - name: Install + build (the engine invokes bin/penny.js → dist/)
        if: steps.engine.outputs.present == 'true'
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build

      - name: Run the deterministic RSI engine (6 dsip steps, $0)
        if: steps.engine.outputs.present == 'true'
        run: node workflows/rsi.workflow.js --deterministic

      # CP158: keep the proposal the engine writes to .rsi/proposed/ (it was lost with the runner).
      # A person reviews it; the loop never commits or merges.
      - name: Upload the proposal for review
        if: always() && steps.engine.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rsi-proposal
          path: .rsi/proposed/
          if-no-files-found: warn

name: CI
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  harness-structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Harness skeleton present
        run: |
          set -e
          for f in identity/SOUL.md brain dsip.json AGENTS.md CLAUDE.md llms.txt .claude-plugin/plugin.json .mcp.json; do
            [ -e "$f" ] || { echo "MISSING: $f"; exit 1; }
          done
          echo "harness skeleton OK"
      - name: Secret scan (no real keys in tree)
        run: |
          set -e
          if grep -rInE 'sk-ant-[A-Za-z0-9_-]{20,}|sk_live_[A-Za-z0-9]{20,}|AKIA[0-9A-Z]{16}|ghp_[A-Za-z0-9]{30,}|xox[bap]-' \
               --exclude-dir=.git --exclude-dir=node_modules . ; then
            echo "::error::potential real secret committed"; exit 1
          fi
          echo "secret scan clean"

  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect runtime
        id: rt
        run: |
          if [ -f package.json ]; then echo "armed=true" >> "$GITHUB_OUTPUT"; else echo "armed=false" >> "$GITHUB_OUTPUT"; fi
      - uses: pnpm/action-setup@v4
        if: steps.rt.outputs.armed == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.rt.outputs.armed == 'true'
        with:
          node-version: 22
          cache: pnpm
      - name: "Install + build + test (red-blocking — full Vitest pyramid: unit/component/contract/chaos/E2E-hermetic)"
        if: steps.rt.outputs.armed == 'true'
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
          pnpm test
      - name: "Eval gate (red-blocking — npm run eval: L1 golden + L2/L3 deterministic scorers, $0/no-network)"
        # `pnpm test` runs the L1/L2/L3 calibration vitests; this runs the eval RUNNER (eval/run.ts) — the
        # operational gate the RSI loop reads (it emits `EVAL <level> result=pass` + exits 0/1). L1 is the
        # merge-blocking $0 floor; L2/L3 scorers are deterministic ($0, no LLM) so they're safe in CI without
        # secrets. RED-BLOCKING: a regressed golden task / sub-F1-gate fails the job. (HARNESS-OVERRIDES §9.)
        if: steps.rt.outputs.armed == 'true'
        run: |
          npm run eval                 # L1 — pure $0 golden-task assertions (the ship floor)
          npm run eval -- --level l2    # L2 — binary behavioral gate, F1≥0.8 / κ≥0.6 (deterministic)
          npm run eval -- --level l3    # L3 — trajectory judge (deterministic scorer; PR+nightly tier)
      - name: Skeleton phase
        if: steps.rt.outputs.armed == 'false'
        run: echo "skeleton phase — build gate auto-arms when package.json lands (CP123 Wave B)"

  # E4 · THE ACCEPTANCE TEST — the spine (PLAN §5). RED-BLOCKING: gates merges. Runs `penny wire` +
  # the 5 assertions (scaffold · checkout E2E re-fetch · raw-body HMAC · idempotent replay · mode+tax
  # pin) entirely in Stripe TEST MODE — no sk_live ever. The live re-fetch assertion uses the
  # STRIPE_SECRET_KEY (sk_test) gh secret; the rest are hermetic.
  acceptance:
    runs-on: ubuntu-latest
    env:
      STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
      STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install + build
        run: |
          pnpm install --frozen-lockfile || pnpm install
          pnpm build
      - name: Install the stripe CLI (webhook self-test rig)
        run: bash scripts/install-stripe-cli.sh
      - name: "Acceptance test — pass^3 (E5: k>=3 for the flaky-sensitive live-Stripe integration)"
        # The acceptance suite includes ONE live test-mode Stripe round-trip (assertion 2). Running it
        # 3× in a row (pass^k, k=3) catches a flaky integration that a single run would miss — all
        # three must be green for the job to pass. RED-BLOCKING: gates merges. Test mode only.
        run: |
          set -e
          for k in 1 2 3; do
            echo "::group::acceptance run $k/3 (pass^3)"
            pnpm test:acceptance
            echo "::endgroup::"
          done

  # G2 · COCKPIT E2E — the one Playwright suite (penny is CLI/MCP-first; the cockpit is the single
  # browser surface, PLAN §9/§10). RED-BLOCKING: boots the stdlib cockpit + screenshots the 5 views
  # and asserts they render LIVE data (brain · run-log money-trail · eval pyramid + WIRED acceptance
  # badge · ask · gaps). No secrets — the cockpit reads only what penny DID (the Ask box is keyless).
  cockpit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile || pnpm install
      - name: Install Playwright chromium (with OS deps)
        run: pnpm exec playwright install --with-deps chromium
      - name: Cockpit E2E (red-blocking — 5 views screenshotted + asserted)
        run: pnpm test:cockpit
      - name: Upload cockpit screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cockpit-screenshots
          path: content/screenshots/cockpit/
          if-no-files-found: ignore

<text x="24" y="66" fill="#7fc492">$ <tspan fill="#f3f0e8">penny --help</tspan></text>
<text x="24" y="86" fill="#d8d3c8" xml:space="preserve">Usage: penny [options] [command]</text>
<text x="24" y="106" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="126" fill="#d8d3c8" xml:space="preserve">payments/billing employee — wires Stripe test-mode billing (checkout,</text>
<text x="24" y="146" fill="#d8d3c8" xml:space="preserve">subscriptions, webhooks, meters, scoped agent-spend) and reviews/debugs billing</text>
<text x="24" y="166" fill="#d8d3c8" xml:space="preserve">code against 21 known pitfalls. Boundary: product billing only — earning loops</text>
<text x="24" y="186" fill="#d8d3c8" xml:space="preserve">are helios.</text>
<text x="24" y="206" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="226" fill="#d8d3c8" xml:space="preserve">Options:</text>
<text x="24" y="246" fill="#d8d3c8" xml:space="preserve">  -v, --version            output the version number</text>
<text x="24" y="266" fill="#d8d3c8" xml:space="preserve">  -h, --help               display help for command</text>
<text x="24" y="286" fill="#a39e93" xml:space="preserve"></text>
<text x="24" y="306" fill="#d8d3c8" xml:space="preserve">Commands:</text>
<text x="24" y="326" fill="#d8d3c8" xml:space="preserve">  wire [options]           scaffold Stripe test-mode billing into a target →</text>
<text x="24" y="346" fill="#d8d3c8" xml:space="preserve">                           checkout E2E + webhook + idempotent</text>
<text x="24" y="366" fill="#d8d3c8" xml:space="preserve">  review [options] &lt;path&gt;  audit a billing integration against the 21</text>
<text x="24" y="386" fill="#d8d3c8" xml:space="preserve">                           KNOWN-PITFALLS → findings list (cites the brain)</text>
<text x="24" y="406" fill="#d8d3c8" xml:space="preserve">  debug &lt;symptom...&gt;       root-cause a billing incident via JTBD-0 (the ledger</text>
<text x="24" y="426" fill="#d8d3c8" xml:space="preserve">                           is the truth, not the status code)</text>
<text x="24" y="446" fill="#d8d3c8" xml:space="preserve">  issue-spt [options]      issue a scoped/capped/expiring Shared Payment Token</text>
<text x="24" y="466" fill="#d8d3c8" xml:space="preserve">                           (agent never sees the card; test mode)</text>
<text x="24" y="486" fill="#d8d3c8" xml:space="preserve">  reconcile [options]      diff internal ledger vs Stripe (meter-event-summary</text>
<text x="24" y="506" fill="#d8d3c8" xml:space="preserve">                           / canonical objects); alarm on divergence</text>
<text x="24" y="526" fill="#d8d3c8" xml:space="preserve">  webhook                  webhook self-test rig (wraps the `stripe` CLI)</text>
<text x="24" y="546" fill="#d8d3c8" xml:space="preserve">  meter                    manage Stripe Meters (near-immutable — name like a</text>
<text x="24" y="566" fill="#d8d3c8" xml:space="preserve">                           public API)</text>
<text x="24" y="586" fill="#d8d3c8" xml:space="preserve">…</text>
</svg>
